name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 連続 push でジョブが積み上がるのを防ぐ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静的解析。秘密情報が必要な本番スキーマ drift は CI では実行しない。
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.1, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check:fast
      - run: pnpm lint:fast
      - run: pnpm format:check
      - run: bash scripts/check-spec-refs.sh
      - run: pnpm security-check
  # 素の `vitest run` は coverage 版と同一内容なので実行しない（-21s）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.1, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: node scripts/check-coverage-tiers.mjs

  build-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.1, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_BUILD: "1"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # 秘密情報が不要な作成・回答フローだけを CI で実行する。
      # ホームと質問一覧はTursoを使うためローカルの pre-push のみ。
      - run: pnpm test:e2e tests/e2e/answer.spec.ts tests/e2e/create.spec.ts
