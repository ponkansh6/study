schema: spec-driven

# Project context — shown to AI when creating artifacts
context: |
  ## 技術スタック
  - Framework: Next.js 16 (App Router, Turbopack)
  - Language: TypeScript 6 (strict mode)
  - Runtime: Node 24+, Package Manager: pnpm 11.9.0
  - UI: React 19, CSS Modules (no Tailwind, no component library)
  - LLM: Google Gemini API (gemini-3.1-flash-lite)
  - Database: Drizzle ORM + Turso (libSQL)
  - Testing: Vitest, Playwright
  - Lint/Format: ESLint (flat config), Oxlint, Oxfmt, Prettier
  - Pre-commit: Husky + lint-staged

  ## プロジェクト構造
  - src/app/ — App Router pages/layouts (RSC)
  - src/app/page.tsx — Home: text input form + quiz set list
  - src/app/quiz/[id]/ — Quiz answer page (RSC + client component)
  - src/app/api/ — API route handlers
  - src/lib/ — Utilities (db, llm, shuffle, constants)
  - src/types/ — TypeScript type definitions
  - tests/ — Test suites (unit, integration, e2e)

  ## ドメイン知識
  - LLM ベースのクイズ生成アプリ
  - ユーザーが知識文章を入力 → LLM がそれを 4 択 10 問に変換
  - 出題順・選択肢順はクライアント側でシャッフル
  - クイズ結果はブラウザ内で採点のみ（DB保存しない v1）

  ## コーディング規約
  - TypeScript strict mode、any 禁止
  - React 関数コンポーネント、明示的な戻り値の型
  - CSS Modules でスタイリング（.module.css）
  - サーバーコンポーネント優先、クライアントコンポーネントは "use client" を明示
  - import パスは @/ (src/) と @server/ (server/) のエイリアスを使用

# Per-artifact rules
rules:
  proposal:
    - Write in Japanese or English based on request language
    - Include "Purpose", "Requirements" with concrete scenarios
    - Include "Data Model" section when adding/modifying data structures
    - Keep proposals under 1000 words
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task must have a clear acceptance criterion
    - Prefer small, independent PRs over monolithic changes
  spec:
    - Each requirement must have at least one Scenario
    - Data models should reference actual TypeScript types
    - UI specifications should reference component names
